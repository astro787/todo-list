
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO-лист</title>

  <style>
    /* CSS — внешний вид приложения */
    :root {
      --bg: #0b0d12;
      --accent: #8b5cf6;
      --card: #131720;
      --text: #f3f4f6;
      --gray: #969eae;
      --border: #252b38;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 28px;
    }

    .task-form {
      display: flex;
      gap: 8px;
    }

    .task-input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
    }

    .task-input::placeholder {
      color: var(--gray);
    }

    .task-input:focus {
      border-color: var(--accent);
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
    }

    .add-button {
      background: var(--accent);
    }

    .add-button:hover {
      background: #7c3aed;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 20px 0 0;
      padding: 0;
      list-style: none;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    .task-text {
      min-width: 0;
      line-height: 1.5;
    }

    .delete-button {
      flex-shrink: 0;
      background: #29202a;
      color: #fca5a5;
    }

    .delete-button:hover {
      background: #45232b;
    }

    .empty-message {
      margin: 20px 0 0;
      color: var(--gray);
      font-size: 14px;
    }

    @media (max-width: 420px) {
      .app {
        padding: 18px;
      }

      h1 {
        font-size: 24px;
      }

      .task-form {
        flex-wrap: wrap;
      }

      .task-input {
        width: 100%;
        flex-basis: 100%;
      }

      .add-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <!-- HTML — структура приложения -->
  <main class="app">
    <h1>Мои задачи</h1>

    <form class="task-form" id="taskForm">
      <input
        class="task-input"
        id="taskInput"
        type="text"
        placeholder="Введите новую задачу..."
        aria-label="Новая задача"
        autocomplete="off"
      >

      <button class="add-button" type="submit">
        Добавить
      </button>
    </form>

    <ul class="task-list" id="taskList"></ul>

    <p class="empty-message" id="emptyMessage">
      Пока задач нет. Добавьте первую!
    </p>
  </main>

  <script>
    // JS — логика приложения
    const taskForm = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");
    const emptyMessage = document.getElementById("emptyMessage");

    const STORAGE_KEY = "todoTasks";

    // Сохраняет текущий список задач
    function saveTasks() {
      const tasks = Array.from(
        taskList.querySelectorAll(".task-text")
      ).map(function (task) {
        return task.textContent;
      });

      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    // Обновляет сообщение, если список пуст
    function updateEmptyMessage() {
      emptyMessage.hidden = taskList.children.length > 0;
    }

    // Создаёт элемент задачи и кнопку удаления
    function renderTask(taskText) {
      const listItem = document.createElement("li");
      listItem.className = "task-item";

      const text = document.createElement("span");
      text.className = "task-text";
      text.textContent = taskText;

      const deleteButton = document.createElement("button");
      deleteButton.className = "delete-button";
      deleteButton.type = "button";
      deleteButton.textContent = "Удалить";
      deleteButton.setAttribute(
        "aria-label",
        "Удалить задачу: " + taskText
      );

      // Удаляем задачу и сохраняем изменения
      deleteButton.addEventListener("click", function () {
        listItem.remove();
        saveTasks();
        updateEmptyMessage();
      });

      listItem.append(text, deleteButton);
      taskList.appendChild(listItem);
    }

    // Добавляет новую задачу
    function addTask() {
      const taskText = taskInput.value.trim();

      // Не добавляем пустую задачу
      if (taskText === "") {
        taskInput.focus();
        return;
      }

      renderTask(taskText);

      // Сохраняем список после добавления
      saveTasks();

      // Очищаем поле и возвращаем фокус
      taskInput.value = "";
      taskInput.focus();

      updateEmptyMessage();
    }

    // Загружает сохранённые задачи
    function loadTasks() {
      const savedTasks = localStorage.getItem(STORAGE_KEY);

      if (savedTasks) {
        try {
          const tasks = JSON.parse(savedTasks);

          if (Array.isArray(tasks)) {
            tasks.forEach(function (task) {
              if (typeof task === "string" && task.trim() !== "") {
                renderTask(task);
              }
            });
          }
        } catch (error) {
          // Если данные повреждены, начинаем с пустого списка
          localStorage.removeItem(STORAGE_KEY);
        }
      }

      updateEmptyMessage();
    }

    // Submit срабатывает и по кнопке, и по Enter
    taskForm.addEventListener("submit", function (event) {
      event.preventDefault();
      addTask();
    });

    // Загружаем задачи при открытии страницы
    loadTasks();
  </script>
</body>
</html>
